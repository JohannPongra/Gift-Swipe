name: Deploy GiftSwipe to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Create public Supabase config
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
              run: |
                  test -n "$SUPABASE_URL"
                  test -n "$SUPABASE_ANON_KEY"
                  printf "window.GIFTSWIPE_CONFIG = { supabaseUrl: '%s', supabaseAnonKey: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > config.js

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload site artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .

            - name: Deploy to Pages
              id: deployment
              uses: actions/deploy-pages@v4
