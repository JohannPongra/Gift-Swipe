<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftSwipe</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="seiteninhalt">
        <header class="kopfbereich">
            <p class="ueberzeile">Geschenkideen entdecken</p>
            <h1>GiftSwipe</h1>
            <p class="einleitung">
                Bewerte Geschenkideen ganz einfach mit „Ja“ oder „Nein“.
            </p>
        </header>

        <section class="geschenkbereich" aria-labelledby="geschenk-titel">
            <article class="geschenkekarte">
                <img
                    class="bildplatzhalter"
                    src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400'%3E%3Crect width='800' height='400' fill='%23dce8e5'/%3E%3Ctext x='400' y='215' fill='%2352706a' font-family='Arial' font-size='42' text-anchor='middle'%3EBild-Platzhalter%3C/text%3E%3C/svg%3E"
                    alt="Bild-Platzhalter für eine gemütliche Leselampe"
                >

                <div class="karteninhalt">
                    <p class="karten-label">Geschenkidee</p>
                    <h2 id="geschenk-titel">Gemütliche Leselampe</h2>
                    <p class="preis">39,99 €</p>
                    <p class="beschreibung">
                        Eine kleine, dimmbare Lampe für gemütliche Lesestunden am Abend.
                    </p>

                    <div class="aktionsbereich">
                        <button class="entscheidungsbutton nein-button" type="button" id="nein-button">
                            Nein
                        </button>
                        <button class="entscheidungsbutton ja-button" type="button" id="ja-button">
                            Ja
                        </button>
                    </div>
                </div>
            </article>

            <p class="fortschritt" aria-label="Fortschritt: Geschenk 1 von 1">1 / 1</p>
        </section>
    </main>
</body>
</html>
