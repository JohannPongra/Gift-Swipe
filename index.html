<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftSwipe</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js?v=3"></script>
    <script src="app.js?v=3" defer></script>
</head>
<body>
    <main class="seiteninhalt">
        <header class="kopfbereich">
            <p class="ueberzeile">Geschenkideen entdecken</p>
            <h1>GiftSwipe</h1>
            <p class="einleitung">
                Bewerte Geschenkideen ganz einfach mit „Ja“ oder „Nein“.
            </p>
        </header>

        <section class="geschenkbereich" aria-labelledby="geschenk-titel">
            <p class="statusmeldung" id="statusmeldung" role="status" aria-live="polite"></p>
            <article class="geschenkekarte">
                <div class="bildgalerie einzelbild-querformat">
                    <button class="bild-navigation bild-zurueck" id="bild-zurueck" type="button" aria-label="Vorheriges Bild" hidden>
                        <span aria-hidden="true">&lsaquo;</span>
                    </button>
                    <img
                        class="bildplatzhalter"
                        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400'%3E%3Crect width='800' height='400' fill='%23dce8e5'/%3E%3Ctext x='400' y='215' fill='%2352706a' font-family='Arial' font-size='42' text-anchor='middle'%3EBild-Platzhalter%3C/text%3E%3C/svg%3E"
                        alt="Gemütliche Leselampe"
                    >
                    <button class="bild-navigation bild-vor" id="bild-vor" type="button" aria-label="Nächstes Bild" hidden>
                        <span aria-hidden="true">&rsaquo;</span>
                    </button>
                    <span class="bildzaehler" id="bildzaehler" aria-live="polite" hidden></span>
                </div>

                <div class="karteninhalt">
                    <p class="karten-label">Geschenkidee</p>
                    <h2 id="geschenk-titel">Gemütliche Leselampe</h2>
                    <p class="beschreibung">
                        Eine stilvolle Leselampe für gemütliche Abende mit einem guten Buch.
                    </p>
                    <a class="produkt-link" id="produkt-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
                        Produkt ansehen
                    </a>

                    <div class="aktionsbereich">
                        <button class="entscheidungsbutton nein-button" type="button" id="nein-button">
                            Nein
                        </button>
                        <button class="entscheidungsbutton ja-button" type="button" id="ja-button">
                            Ja
                        </button>
                    </div>
                </div>
            </article>

            <p class="fortschritt" aria-label="Fortschritt: Geschenk 1 von 2">1 / 2</p>
            <p class="abschlussmeldung" id="abschlussmeldung" role="status" hidden></p>
            <button class="weiter-button" id="weiter-button" type="button" hidden>Ja-Auswahl erneut ansehen</button>
        </section>
    </main>
</body>
</html>
